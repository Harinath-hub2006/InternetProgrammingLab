<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Shopping - Order Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #2d6cdf;
      margin-top: 0;
      font-size: 24px;
      margin-bottom: 20px;
    }
    button {
      background-color: #2d6cdf;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1a52b8;
    }
    /* Styles for the dynamically generated table */
    #orderData h2 {
      color: #333;
      font-size: 20px;
      margin-top: 30px;
      margin-bottom: 15px;
      text-align: left;
    }
    #orderData table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    #orderData th, #orderData td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    #orderData th {
      background-color: #2d6cdf;
      color: white;
    }
    #orderData tr:hover {
      background-color: #f9f9f9;
    }
    #orderData td:last-child {
      font-weight: bold;
      color: #27ae60;
    }
  </style>
  <script>
    function loadOrders() {
      var xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
          var xml = this.responseXML;
          var orders = xml.getElementsByTagName("order");
          var output = "<h2>Order Details</h2>";
          output += "<table>";
          output += "<tr><th>ID</th><th>Customer</th><th>Product</th>" +
                     "<th>Quantity</th><th>Price</th></tr>";

          for (var i = 0; i < orders.length; i++) {
            var o = orders[i];
            function val(tag) { return o.getElementsByTagName(tag)[0].childNodes[0].nodeValue; }
            var id = val("id");
            var customer = val("customer");
            var product = val("product");
            var quantity = val("quantity");
            var price = val("price");

            output += "<tr><td>" + id + "</td><td>" + customer + "</td>" +
                      "<td>" + product + "</td><td>" + quantity + "</td>" +
                      "<td>$" + price + "</td></tr>";
          }

          output += "</table>";
          document.getElementById("orderData").innerHTML = output;
        }
      };
      xhttp.open("GET", "orders.xml", true);
      xhttp.send();
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>Online Shopping - Order Viewer</h1>
    <button onclick="loadOrders()">Load Orders</button>
    <div id="orderData"></div>
  </div>
</body>
</html>
